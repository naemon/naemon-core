###############################################################################
# Mod-Gearman NEB module configuration for the naemon dev container.
#
# Trimmed down version of etc/mod_gearman_neb.conf.in from
# https://github.com/sni/mod_gearman -- see that file for every option.
###############################################################################

# 0 = only errors, 1 = debug, 2 = trace, 3 = trace incl. gearman logs
debug=1

logfile=/workspaces/naemon-core/build/var/log/naemon/mod_gearman_neb.log

# The gearmand service from .devcontainer/docker-compose.yml.
server=gearmand:4730

eventhandler=yes
notifications=yes
services=yes
hosts=yes

# Must be identical to the key in mod_gearman_worker.conf.
# At least 8 and at most 32 characters.
key=naemon-dev-key
