# Example drop-in for the Statusengine broker -- https://github.com/statusengine/broker
#
# naemon.cfg already ships "event_broker_options=-1" and
# "include_dir=module-conf.d", so dropping this file into
# build/etc/naemon/module-conf.d/ is all that is needed to load the module.
# The task "broker modules: install config drop-ins" copies it for you.
#
# Build the module first:
#   Terminal > Run Task... > broker module: build (statusengine)
#
# meson mirrors the source tree in the build directory, and the target is
# declared in src/meson.build, so the shared module ends up in build/src/.
# Verify with: find /workspaces/modules/broker/build -name 'libstatusengine.so'

broker_module=/workspaces/modules/broker/build/src/libstatusengine.so /workspaces/naemon-core/build/etc/naemon/statusengine.toml
