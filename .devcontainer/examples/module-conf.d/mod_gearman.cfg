# Example drop-in for mod_gearman -- https://github.com/sni/mod_gearman
#
# naemon.cfg already ships "event_broker_options=-1" and
# "include_dir=module-conf.d", so dropping this file into
# build/etc/naemon/module-conf.d/ is all that is needed to load the module.
# The task "broker modules: install config drop-ins" copies it for you.
#
# Build the module first:
#   Terminal > Run Task... > broker module: build (mod_gearman)
#
# The NEB module is built into the root of the mod_gearman checkout, not into
# a subdirectory. Adjust the path below if your sources live somewhere else
# than the default /workspaces/modules mount.

broker_module=/workspaces/modules/mod_gearman/mod_gearman_naemon.o config=/workspaces/naemon-core/build/etc/naemon/mod_gearman_neb.conf
