###############################################################################
# Mod-Gearman worker configuration for the naemon dev container.
#
# Start the worker in a container terminal to actually have checks executed:
#   /workspaces/modules/mod_gearman/mod_gearman_worker \
#       --config=/workspaces/naemon-core/build/etc/naemon/mod_gearman_worker.conf
#
# Trimmed down version of etc/mod_gearman_worker.conf.in from
# https://github.com/sni/mod_gearman -- see that file for every option.
###############################################################################

debug=1

logfile=/workspaces/naemon-core/build/var/log/naemon/mod_gearman_worker.log

# The gearmand service from .devcontainer/docker-compose.yml.
server=gearmand:4730

eventhandler=yes
notifications=yes
services=yes
hosts=yes

# Must be identical to the key in mod_gearman_neb.conf.
key=naemon-dev-key

job_timeout=60

# Keep the worker small, this is a development setup.
min-worker=1
max-worker=5
idle-timeout=30
